<div class="update-profile-form glass-form">
  <h2>🛠️ تعديل الملف الشخصي</h2>

  <form *ngIf="clientForm" [formGroup]="clientForm" (ngSubmit)="onSubmit()">
    <label>👤 الاسم:</label>
    <input formControlName="fullName" type="text" />

    <label>📞 الهاتف:</label>
    <input formControlName="phone" type="text" />

    <label>✉️ البريد الإلكتروني:</label>
    <input formControlName="email" type="email" />

    <div formGroupName="address">
      <label>🌍 البلد:</label>
      <select formControlName="country" (change)="onCountryChange($event)">
        <option *ngFor="let country of countries" [value]="country.id">{{ country.name }}</option>
      </select>

      <label>🏙️ المدينة:</label>
      <select formControlName="city">
        <option value="">اختر المدينة</option>
        <option *ngFor="let city of cities" [value]="city.id">{{ city.name }}</option>
      </select>
    </div>

    <button type="submit">💾 حفظ التعديلات</button>
  </form>
</div>

<app-footer></app-footer>
